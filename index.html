<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6-сынып – Сынып сағаттары және Қауіпсіздік сабақтары 2026–2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2340;--muted:#5c6480;--bg:#f5efe4;--card:rgba(255,255,255,.92);--line:#e8dcc8;--teal:#16807d;--teal2:#e2f3f1;--indigo:#232c5c;--amber:#e0a43a;--amber2:#fdf2dc;--red:#c4513a;--red2:#fbe7e1;--green:#2f8a52;--green2:#e2f4e8;--r:18px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans',system-ui,sans-serif;color:var(--ink);line-height:1.55;font-size:16px;
 background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27120%27%20height%3D%27120%27%20viewBox%3D%270%200%20120%20120%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23c9a96a%27%20stroke-opacity%3D%270.22%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M60%2060c0-14%2010-22%2020-18s8%2018-2%2018c-6%200-7-8-2-9%27/%3E%3Cpath%20d%3D%27M60%2060c0-14-10-22-20-18s-8%2018%202%2018c6%200%207-8%202-9%27/%3E%3Cpath%20d%3D%27M60%2060c0%2014%2010%2022%2020%2018s8-18-2-18c-6%200-7%208-2%209%27/%3E%3Cpath%20d%3D%27M60%2060c0%2014-10%2022-20%2018s-8-18%202-18c6%200%207%208%202%209%27/%3E%3Ccircle%20cx%3D%2760%27%20cy%3D%2760%27%20r%3D%273%27%20fill%3D%27%23c9a96a%27%20fill-opacity%3D%270.22%27/%3E%3C/g%3E%3C/svg%3E") 0 0/120px 120px, radial-gradient(1200px 700px at 100% -10%, #d9efec 0%, transparent 60%), radial-gradient(900px 600px at -10% 110%, #f6dfc0 0%, transparent 60%), linear-gradient(160deg,#f8f3ea 0%,#f1ebe0 50%,#eaf2f1 100%);background-attachment:fixed}
a{color:var(--teal)}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{color:#eef0fa;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;
 background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27120%27%20height%3D%27120%27%20viewBox%3D%270%200%20120%20120%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-opacity%3D%270.07%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M60%2060c0-14%2010-22%2020-18s8%2018-2%2018c-6%200-7-8-2-9%27/%3E%3Cpath%20d%3D%27M60%2060c0-14-10-22-20-18s-8%2018%202%2018c6%200%207-8%202-9%27/%3E%3Cpath%20d%3D%27M60%2060c0%2014%2010%2022%2020%2018s8-18-2-18c-6%200-7%208-2%209%27/%3E%3Cpath%20d%3D%27M60%2060c0%2014-10%2022-20%2018s-8-18%202-18c6%200%207%208%202%209%27/%3E%3Ccircle%20cx%3D%2760%27%20cy%3D%2760%27%20r%3D%273%27%20fill%3D%27%23ffffff%27%20fill-opacity%3D%270.07%27/%3E%3C/g%3E%3C/svg%3E") 0 0/120px 120px, linear-gradient(175deg,#232c5c 0%,#1d3d63 55%,#145f63 100%);box-shadow:4px 0 24px rgba(20,25,60,.18)}
aside h1{font-family:'Noto Serif',serif;font-size:21px;margin:4px 6px 2px;line-height:1.25;color:#f5d48f}
aside .sub{font-size:12.5px;opacity:.8;margin:0 6px 14px}
aside .home{display:block;padding:10px 12px;border-radius:12px;color:#1c1608;text-decoration:none;font-weight:700;background:linear-gradient(90deg,#f0c060,#e0a43a);margin-bottom:10px;box-shadow:0 4px 14px rgba(224,164,58,.35)}
.mo{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#f5d48f;opacity:.85;margin:16px 8px 5px;display:flex;align-items:center;gap:8px}
.mo:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(245,212,143,.5),transparent)}
.nav a{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:10px;color:#e3e7f6;text-decoration:none;font-size:13.5px;line-height:1.3;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.09);transform:translateX(2px)}
.nav a.on{background:linear-gradient(90deg,#f0c060,#e0a43a);color:#1c1608}
.nav .no{flex:0 0 26px;height:22px;border-radius:7px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:12px;font-weight:700}
.nav a.on .no{background:rgba(0,0,0,.15)}
.nav .past{opacity:.62}
main{padding:28px clamp(16px,4vw,48px) 80px;max-width:1080px}
.burger{display:none}
.hero{color:#fff;border-radius:26px;padding:30px 30px;position:relative;overflow:hidden;
 background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27120%27%20height%3D%27120%27%20viewBox%3D%270%200%20120%20120%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-opacity%3D%270.07%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M60%2060c0-14%2010-22%2020-18s8%2018-2%2018c-6%200-7-8-2-9%27/%3E%3Cpath%20d%3D%27M60%2060c0-14-10-22-20-18s-8%2018%202%2018c6%200%207-8%202-9%27/%3E%3Cpath%20d%3D%27M60%2060c0%2014%2010%2022%2020%2018s8-18-2-18c-6%200-7%208-2%209%27/%3E%3Cpath%20d%3D%27M60%2060c0%2014-10%2022-20%2018s-8-18%202-18c6%200%207%208%202%209%27/%3E%3Ccircle%20cx%3D%2760%27%20cy%3D%2760%27%20r%3D%273%27%20fill%3D%27%23ffffff%27%20fill-opacity%3D%270.07%27/%3E%3C/g%3E%3C/svg%3E") 0 0/120px 120px, linear-gradient(125deg,#232c5c 0%,#1f5479 45%,#16807d 100%);box-shadow:0 18px 40px rgba(35,44,92,.25)}
.hero:before{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(240,192,96,.45),transparent 70%)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#e0a43a,#f5d48f,#16807d,#c4513a)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;position:relative}
.chip{display:inline-block;font-size:12.5px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);font-weight:600;backdrop-filter:blur(4px)}
.hero h2{font-family:'Noto Serif',serif;font-size:clamp(22px,3vw,31px);margin:4px 0 8px;line-height:1.25;position:relative}
.hero .age{font-size:17px;opacity:.93;position:relative}
.quote{margin-top:14px;padding:11px 15px;border-left:4px solid var(--amber);background:rgba(10,15,40,.22);border-radius:0 12px 12px 0;font-style:italic;position:relative}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-top:20px;box-shadow:0 6px 22px rgba(60,50,30,.07);position:relative;overflow:hidden;backdrop-filter:blur(6px)}
.card:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--teal),#5fb8b1)}
.card h3{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:10px;color:var(--indigo)}
.card h3 .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#e2f3f1,#c9e8e4);font-size:19px;flex:0 0 38px}
.card.safety{border:1px solid #f0d39a;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27120%27%20height%3D%27120%27%20viewBox%3D%270%200%20120%20120%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23e0a43a%27%20stroke-opacity%3D%270.12%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M60%2060c0-14%2010-22%2020-18s8%2018-2%2018c-6%200-7-8-2-9%27/%3E%3Cpath%20d%3D%27M60%2060c0-14-10-22-20-18s-8%2018%202%2018c6%200%207-8%202-9%27/%3E%3Cpath%20d%3D%27M60%2060c0%2014%2010%2022%2020%2018s8-18-2-18c-6%200-7%208-2%209%27/%3E%3Cpath%20d%3D%27M60%2060c0%2014-10%2022-20%2018s-8-18%202-18c6%200%207%208%202%209%27/%3E%3Ccircle%20cx%3D%2760%27%20cy%3D%2760%27%20r%3D%273%27%20fill%3D%27%23e0a43a%27%20fill-opacity%3D%270.12%27/%3E%3C/g%3E%3C/svg%3E") 0 0/120px 120px, linear-gradient(#fffdf8,#fff6e6)}
.card.safety:before{background:linear-gradient(90deg,#c4513a,#e0a43a,#f5d48f)}
.card.safety h3 .ic{background:linear-gradient(135deg,#fdf2dc,#f7dca8)}
.card.ebbk{border:1px solid #ddd2f5;background:linear-gradient(#fdfbff,#f5f0ff)}
.card.ebbk:before{background:linear-gradient(90deg,#7a64b8,#b49be8,#f2a8c8)}
.card.ebbk h3 .ic{background:linear-gradient(135deg,#ece6fb,#dcd0f7)}
ul.clean{padding-left:20px;margin:6px 0}
ul.clean li{margin:4px 0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:12px 0 4px}
.vid{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);margin-top:8px;background:#fff}
.vid:hover{border-color:var(--teal)}
.vid .pl{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:0 0 38px;font-size:14px}
.vid small{color:var(--muted);display:block}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.q .qt{font-weight:600;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer}
.opt{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fbfaf8;text-align:left}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.ok{background:var(--green2);border-color:var(--green);font-weight:600}
.opt.bad{background:var(--red2);border-color:var(--red)}
.score{margin-top:12px;font-weight:700;padding:10px 14px;border-radius:10px;background:var(--teal2);display:none}
.tfrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.tfrow .st{flex:1}
.tfb{padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600}
.tfrow.ok{background:var(--green2);border-color:var(--green)}
.tfrow.bad{background:var(--red2);border-color:var(--red)}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.step{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left}
.step.done{background:var(--green2);border-color:var(--green);cursor:default}
.step.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.order div{padding:8px 12px;border-radius:9px;background:var(--teal);color:#fff;font-size:14.5px}
.task{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.task .tn{display:inline-block;background:var(--amber);color:#1b1205;font-weight:800;border-radius:8px;padding:2px 9px;font-size:13px;margin-right:6px}
.task b{font-size:16.5px}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin-top:8px;resize:vertical;background:#fdfcfa}
.desc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.desc label{font-size:13.5px;background:var(--teal2);padding:5px 10px;border-radius:99px;cursor:pointer;display:flex;gap:6px;align-items:center}
.algo{display:flex;flex-direction:column;gap:6px;counter-reset:a}
.algo div{counter-increment:a;padding:9px 12px 9px 44px;position:relative;background:var(--amber2);border-radius:10px}
.algo div:before{content:counter(a);position:absolute;left:10px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--amber);color:#1b1205;font-weight:800;display:grid;place-items:center;font-size:13px}
.algoname{font-weight:800;letter-spacing:.03em;color:var(--red);margin:8px 0}
.case{background:#f3f6f6;border-radius:12px;padding:12px 14px}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.nums div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px}
.nums b{display:block;font-size:22px;color:var(--red)}
.emo{display:flex;gap:10px;flex-wrap:wrap}
.emo button{font-size:28px;width:62px;height:62px;border-radius:14px;border:2px solid var(--line);background:#fff}
.emo button.on{border-color:var(--teal);background:var(--teal2)}
.emo small{display:block;font-size:11px}
.sent{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sent button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px}
.sent button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;margin-top:12px}
.thanks{display:none;margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--green2)}
.hw{background:var(--amber2);border-radius:12px;padding:14px 16px;font-size:16.5px}
.big{font-size:19px;line-height:1.6}
.ebbkq{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px;background:#fff;border:1px solid #ddd3f3;margin-top:10px;font-size:18px}
.ebbkq .st{flex:1}
.ebbkq button{font-size:26px;width:58px;height:58px;border-radius:14px;border:2px solid #ddd3f3;background:#fff}
.ebbkq.ok{background:var(--green2)} .ebbkq.bad{background:var(--red2)}
table.cyc{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
.cyc th{background:var(--teal);color:#fff;text-align:left;padding:9px 10px;font-weight:600}
.cyc td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top}
.cyc tr:hover td{background:#fbf7f0;cursor:pointer}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--amber2);color:#7a4a05}
.pager{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
.pager a{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:var(--ink)}
.pager a small{display:block;color:var(--muted)}
.foot{margin-top:30px;font-size:13px;color:var(--muted)}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 25% 0 0;z-index:5;transform:translateX(-105%);transition:.25s;height:100%}aside.open{transform:none}.burger{display:inline-flex;position:sticky;top:10px;z-index:4;margin-bottom:12px;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700}.grid2,.opts{grid-template-columns:1fr}.nums{grid-template-columns:repeat(3,1fr)}main{padding-top:14px}}

#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#232c5c 0%,#1f5479 50%,#16807d 100%)}
#gate .box{background:#fffdf8;border-radius:22px;padding:30px 28px;max-width:400px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.3)}
#gate h2{font-family:'Noto Serif',serif;margin:0 0 4px;color:#232c5c;font-size:23px}
#gate p{margin:0 0 16px;color:#5c6480;font-size:14px}
#gate input[type=text],#gate input[type=password]{width:100%;padding:12px 14px;border:1px solid #e8dcc8;border-radius:12px;font:inherit;margin-bottom:10px;background:#fff}
#gate button{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(90deg,#f0c060,#e0a43a);color:#1c1608;font-weight:800;font:inherit;font-weight:800;cursor:pointer}
#gate .err{color:#c4513a;font-size:14px;min-height:20px;margin-top:8px}
#gate label{display:flex;gap:8px;align-items:center;font-size:14px;color:#5c6480;margin:2px 0 14px}
#lic{position:fixed;right:12px;bottom:12px;z-index:40;background:rgba(35,44,92,.88);color:#f5d48f;font-size:12px;padding:6px 12px;border-radius:99px;pointer-events:none}
#logout{display:block;margin-top:10px;background:rgba(255,255,255,.1);color:#e3e7f6;border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;width:100%}
</style>
</head>
<body>
<div id="gate"><form class="box" id="gform"><h2>🔒 6-сынып сабақтары</h2><p>Сабақтарды ашу үшін сатып алғанда берілген логин мен құпиясөзді енгізіңіз.</p>
<input type="text" id="glogin" placeholder="Логин" autocomplete="username" required>
<input type="password" id="gpass" placeholder="Құпиясөз" autocomplete="current-password" required>
<label><input type="checkbox" id="gremember" checked> Осы құрылғыда есте сақта</label>
<button type="submit" id="gbtn">Кіру</button><div class="err" id="gerr"></div></form></div><div id="lic" style="display:none"></div>
<div class="app">
<aside id="side">
  <h1>6-сынып</h1>
  <div class="sub">«Адал азамат» – сынып сағаттары мен «Қауіпсіздік сабақтары» · 2026–2027 оқу жылы</div>
  <a class="home" href="#home">🏠 Басты бет – циклограмма</a>
  <div class="nav" id="nav"></div>
</aside>
<main id="main"></main>
</div>
<script>
let D = null;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const sNum = id => /^\d+$/.test(id) ? '№'+id+' сабақ (6-сыныпқа арналған тізім)' : 'Сынып жетекшінің жоспары бойынша';

function nav(){
  let h='', m='';
  D.L.forEach(l=>{
    if(l.month!==m){m=l.month; h+=`<div class="mo">${m}</div>`}
    h+=`<a href="#lesson-${l.n}" data-n="${l.n}" class="${l.n<8?'past':''}"><span class="no">${l.n}</span><span>${esc(l.topic.replace(/[«»]/g,''))}<br><small style="opacity:.7">${l.date}</small></span></a>`;
  });
  $('#nav').innerHTML=h;
}

function home(){
  let rows = D.L.map(l=>{const s=D.S[l.safety];return `<tr onclick="location.hash='lesson-${l.n}'"><td><b>${l.n}</b></td><td>${l.date}</td><td>${esc(l.topic)}<br><small style="color:var(--muted)">${esc(l.value)}${l.age?' · '+esc(l.age):''}</small></td><td>${/^\d+$/.test(l.safety)?`<span class="tag">№${l.safety}</span> `:''}${esc(s.title)}${l.focus?`<br><small style="color:var(--muted)">${esc(l.focus)}</small>`:''}</td></tr>`}).join('');
  $('#main').innerHTML = `<button class="burger" onclick="$('#side').classList.toggle('open')">☰ Сабақтар</button>

function lesson(n){

  const s = D.S[l.safety];
  const prev = D.L.find(x=>x.n==n-1), next = D.L.find(x=>x.n==n+1);

    <div class="card"><h3><span class="ic">🎬</span>Видео және материалдар</h3>
      ${vids.map(v=>`<a class="vid" href="${esc(v[1])}" target="_blank" rel="noopener"><span class="pl">▶</span><span>${esc(v[0])}<small>${v[2]}</small></span></a>`).join('')}</div>

  <div class="card"><h3><span class="ic">📚</span>Білім қоржыны</h3><ul class="clean">${l.info.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>

  ${l.sub?`<div class="card" style="border:1px solid #c9b8f0"><h3><span class="ic">🤝</span>ДОСБОЛLIKE: ${esc(l.sub[0])}</h3><p style="margin:0">${esc(l.sub[1])}</p></div>`:''}

    <div class="score" id="qscore"></div>

  </div>

    <div class="lbl">Практикалық жаттығу</div><p style="margin:0">${esc(s.practice)}</p>

    <div class="emo" id="emo">${[['🤩','Керемет'],['🙂','Жақсы'],['🤔','Ойландым'],['😕','Қиын']].map(e=>`<button data-v="${e[1]}">${e[0]}<small>${e[1]}</small></button>`).join('')}</div>
    <div class="lbl">Сөйлемді таңдап, аяқта</div>
    <div class="sent" id="sent">${s.reflect.map(r=>`<button>${esc(r)}</button>`).join('')}</div>
    <textarea id="fb" placeholder="Сөйлемді аяқта немесе пікіріңді жаз...">${esc(saved.fb||'')}</textarea>
    <div class="lbl">Бүгінгі сабақтан алған басты ойым (шығу билеті)</div>
    <textarea data-k="exit" placeholder="Бір сөйлеммен...">${esc(saved.exit||'')}</textarea>
    <button class="primary" id="send">Кері байланысты сақтау</button>
    <div class="thanks" id="thanks"></div>
  </div>

  <div class="card"><h3><span class="ic">🏠</span>Үй тапсырмасы</h3><div class="hw">${esc(l.hw)}</div></div>

  <div class="card ebbk"><h3><span class="ic">🌈</span>ЕББҚ оқушысына арналған тапсырма</h3>
    <p class="big" style="margin-top:0">${esc(l.ebbk)}</p>
    <div class="lbl">Қарапайым ойын: 👍 дұрыс па, 👎 бұрыс па?</div>
    <div id="eb">${s.tf.slice(0,3).map(t=>`<div class="ebbkq" data-a="${t[1]}"><span class="st">${esc(t[0])}</span><button data-v="true">👍</button><button data-v="false">👎</button></div>`).join('')}</div>

  </div>

  <div class="pager">${prev?`<a href="#lesson-${prev.n}"><small>← Алдыңғы</small>${prev.n}. ${esc(prev.topic)}</a>`:'<span></span>'}${next?`<a href="#lesson-${next.n}" style="text-align:right"><small>Келесі →</small>${next.n}. ${esc(next.topic)}</a>`:'<span></span>'}</div>`;

  // quiz
  let correct=0, answered=0;
  const qs=$('#qscore');
  document.querySelectorAll('#quiz .q').forEach(qd=>{
    const q=quizAll[+qd.dataset.i];
    qd.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j; qd.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      qd.querySelectorAll('.opt')[q.a].classList.add('ok'); if(j!==q.a) b.classList.add('bad'); else correct++;
      answered++; if(answered===quizAll.length){qs.style.display='block'; qs.textContent=`Нәтиже: ${correct} / ${quizAll.length} ${correct===quizAll.length?'🏆 Керемет!':correct>=quizAll.length*0.6?'👍 Жақсы!':'📖 Тағы бір қайталап көр.'}`}
    });
  });

  let tfc=0, tfa=0;
  document.querySelectorAll('#tf .tfrow').forEach(r=>r.querySelectorAll('.tfb').forEach(b=>b.onclick=()=>{
    if(r.dataset.done)return; r.dataset.done=1; const ok=b.dataset.v===r.dataset.a; r.classList.add(ok?'ok':'bad'); if(ok)tfc++; tfa++;
    if(!ok) r.querySelector('.st').innerHTML+=` <b>(Дұрысы: ${r.dataset.a==='true'?'Шын':'Жалған'})</b>`;
    if(tfa===s.tf.length){const e=$('#tfscore');e.style.display='block';e.textContent=`Нәтиже: ${tfc} / ${s.tf.length}`}
  }));

  shuffle(s.algo.map((t,i)=>({t,i}))).forEach(o=>{const b=document.createElement('button');b.className='step';b.textContent=o.t;b.onclick=()=>{
    if(b.classList.contains('done'))return;
    if(o.i===pos){b.classList.add('done');const d=document.createElement('div');d.textContent=(pos+1)+'. '+o.t;ord.appendChild(d);pos++;
      if(pos===s.algo.length){const e=$('#alscore');e.style.display='block';e.textContent=err?`Дайын! Қателер саны: ${err}. Алгоритмді жаттап ал!`:'🏆 Мінсіз! Алгоритмді толық білесің.'}}
    else{err++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}};st.appendChild(b)});
  // ebbk
  document.querySelectorAll('#eb .ebbkq').forEach(r=>r.querySelectorAll('button').forEach(b=>b.onclick=()=>{r.classList.remove('ok','bad');r.classList.add(b.dataset.v===r.dataset.a?'ok':'bad')}));
  // feedback
  let mood=saved.mood||'';
  document.querySelectorAll('#emo button').forEach(b=>{if(b.dataset.v===mood)b.classList.add('on');b.onclick=()=>{mood=b.dataset.v;document.querySelectorAll('#emo button').forEach(x=>x.classList.toggle('on',x===b))}});
  document.querySelectorAll('#sent button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sent button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const fb=$('#fb');fb.value=b.textContent.replace(/\.\.\.$|…$/,'').trim()+' ';fb.focus()});
  const save=()=>{const o={mood,fb:$('#fb').value};document.querySelectorAll('textarea[data-k]').forEach(t=>o[t.dataset.k]=t.value);store.set(key,o);return o};
  document.querySelectorAll('textarea').forEach(t=>t.oninput=save);
  $('#send').onclick=()=>{const o=save();const th=$('#thanks');th.style.display='block';th.innerHTML=`<b>Рахмет! Кері байланысың сақталды.</b><br>Көңіл күй: ${esc(o.mood||'—')}<br>Пікір: ${esc(o.fb||'—')}<br>Шығу билеті: ${esc(o.exit||'—')}<br><small>Жауаптар осы құрылғыда ғана сақталады – сынып жетекшіге ауызша немесе дәптерге жеткіз.</small>`};
  window.scrollTo(0,0);
}

}

const _b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const _rk = 'lic-' + SEC.id;
async function _open(raw, name){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const txt = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:_b(SEC.iv)}, key, _b(SEC.ct)));
  D = JSON.parse(txt);
  document.getElementById('gate').remove();
  const lic = document.getElementById('lic'); lic.textContent = 'Лицензия: ' + name; lic.style.display = 'block';
  const side = document.getElementById('side'); const lo = document.createElement('button'); lo.id = 'logout'; lo.textContent = '🔓 Шығу (' + name + ')';
  lo.onclick = () => { try{localStorage.removeItem(_rk)}catch(e){} location.reload(); }; side.insertBefore(lo, side.querySelector('.home'));
  window.__start();
}
async function _login(login, pw){
  const u = SEC.users[login.trim().toLowerCase()]; if(!u) throw new Error('no');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim()), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:_b(u.s), iterations:SEC.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:_b(u.i)}, k, _b(u.w))));
}
(async () => {
  try{ const s = JSON.parse(localStorage.getItem(_rk)); if(s){ await _open(_b(s.k), s.n); return; } }catch(e){ try{localStorage.removeItem(_rk)}catch(e2){} }
  document.getElementById('gform').onsubmit = async ev => {
    ev.preventDefault(); const err = document.getElementById('gerr'), btn = document.getElementById('gbtn');
    err.textContent = ''; btn.textContent = 'Тексерілуде...'; btn.disabled = true;
    try{
      const p = await _login(document.getElementById('glogin').value, document.getElementById('gpass').value);
      if(document.getElementById('gremember').checked){ try{localStorage.setItem(_rk, JSON.stringify(p))}catch(e){} }
      await _open(_b(p.k), p.n);
    }catch(e){ err.textContent = 'Логин немесе құпиясөз қате.'; btn.textContent = 'Кіру'; btn.disabled = false; }
  };
})();
